<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clinova</title>
<meta name="theme-color" id="tc" content="#5b110b"><meta name="application-name" content="Clinova"><meta name="apple-mobile-web-app-title" content="Clinova"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
<style>
:root{--bg:#F2F2F3;--card:#fff;--ink:#111;--mut:#6B6B6F;--line:#E4E4E6;--acc:#5b110b;--btn:#5b110b;--soft:#F4E9EC;--tile:#D2D2D7;--face:#fff;--bad:#C73A3A;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111113;--card:#1c1c1f;--ink:#F2F2F3;--mut:#A0A0A6;--line:#2E2E32;--acc:#E39AAC;--btn:#7A1F36;--soft:#2a1a1f;--tile:#3a3a40;--face:#26262a;--bad:#F08A8A}}
:root[data-theme="dark"]{--bg:#111113;--card:#1c1c1f;--ink:#F2F2F3;--mut:#A0A0A6;--line:#2E2E32;--acc:#E39AAC;--btn:#7A1F36;--soft:#2a1a1f;--tile:#3a3a40;--face:#26262a;--bad:#F08A8A}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:520px;margin:0 auto;padding:16px 16px 100px}
h1{font-size:28px;margin:4px 0 2px}h2{font-size:17px;margin:0 0 10px}
.mut{color:var(--mut);font-size:13px}
.card{background:var(--card);border-radius:18px;padding:14px;margin-top:12px}
button,input,textarea{font-family:inherit;color:var(--ink)}
input,textarea{width:100%;box-sizing:border-box;min-height:44px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px;background:var(--card);margin-top:6px}
label{font-size:13px;font-weight:600;color:var(--mut);display:block;margin-top:10px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;border:0;border-radius:14px;background:var(--btn);color:#fff;font-size:15px;font-weight:700;margin-top:12px;cursor:pointer}
.btn.o{background:transparent;border:1.5px solid var(--acc);color:var(--acc)}
.row{display:flex;align-items:center;gap:10px}
.pill{border:1.5px solid var(--line);background:var(--card);border-radius:12px;min-height:38px;padding:0 12px;font-size:13px;font-weight:700;cursor:pointer}
.pill.on{border-color:var(--acc);background:var(--soft);color:var(--acc)}
.seg{display:flex;background:var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:38px;border:0;border-radius:10px;background:transparent;font-weight:700;color:var(--mut);cursor:pointer}
.seg button.on{background:var(--card);color:var(--acc);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.pi{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer}
.av{width:42px;height:42px;border-radius:21px;background:var(--soft);color:var(--acc);font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.tt{border-radius:11px;overflow:hidden;background:var(--tile);flex:none;position:relative}
.tb{border:0;background:none;padding:3px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;font-size:11px;font-weight:700;color:var(--mut);position:relative}
.tb.sel{outline:2px solid var(--acc);outline-offset:1px;color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px 0;justify-items:center}
.rx{position:absolute;right:-2px;top:-2px;min-width:20px;height:16px;border-radius:8px;background:#111;color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;min-height:44px;font-size:12px;font-weight:700;color:var(--mut);cursor:pointer}
nav button.on{color:var(--acc)}
.lk{border:0;background:none;color:var(--acc);font-size:14px;font-weight:600;padding:0;min-height:32px;cursor:pointer}
.mini{border:0;background:var(--btn);color:#fff;border-radius:10px;min-height:38px;padding:0 14px;font-size:13px;font-weight:700;cursor:pointer}.mini.o{background:transparent;border:1.5px solid var(--line);color:var(--ink)}.chip{font-size:11px;font-weight:700;padding:4px 9px;border-radius:9px;flex:none}.g8{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}.g8 .pill{padding:0;min-height:42px}.sheet{position:fixed;inset:0;z-index:20}.sheet .sc{position:absolute;inset:0;background:rgba(17,17,17,.45)}.sheet .pn{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow-y:auto;background:var(--card);border-radius:24px 24px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));box-sizing:border-box}.tl{display:flex;align-items:center;width:100%;min-height:48px;border:0;border-top:1px solid var(--line);background:none;font-size:16px;font-weight:600;text-align:left;cursor:pointer}select{width:100%;min-height:44px;border:1.5px solid var(--line);border-radius:12px;padding:0 10px;font-size:16px;background:var(--card);margin-top:6px}</style></head>
<body><div id="app"></div>
<nav><button data-act="tab" data-t="home" id="n0">Hoy</button><button data-act="tab" data-t="appts" id="n3">Citas</button><button data-act="tab" data-t="list" id="n1">Pacientes</button><button data-act="tab" data-t="fin" id="n4">Finanzas</button><button data-act="tab" data-t="stock" id="n5">Stock</button><button data-act="tab" data-t="set" id="n2">Ajustes</button></nav>
<input type="file" id="rf" accept=".json,application/json" hidden>
<script>
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var S,V={v:'home',cal:'week',id:null,arch:'sup',sel:26,cond:'car',q:'',del:false},cloud='Guardado solo en este teléfono',ref=null,timer=null;
var COL={car:'#D64545',obt:'#2F6FB3',cor:'#D98A1F',end:'#7A55B3'};
var CONDS=[['sano','Sano'],['car','Caries'],['obt','Obturado'],['cor','Corona'],['end','Endodoncia'],['pro','Prótesis'],['ext','Extracción'],['aus','Ausente']];
var PT={t:'0,0 36,0 24,12 12,12',b:'12,24 24,24 36,36 0,36',l:'0,0 12,12 12,24 0,36',r:'36,0 36,36 24,24 24,12',c:'12,12 24,12 24,24 12,24'};
var NAMES={1:'Incisivo central',2:'Incisivo lateral',3:'Canino',4:'Primer premolar',5:'Segundo premolar',6:'Primer molar',7:'Segundo molar',8:'Tercer molar'};
var SIDE={1:'superior derecho',2:'superior izquierdo',3:'inferior izquierdo',4:'inferior derecho'};
var SUP=[18,17,16,15,14,13,12,11,21,22,23,24,25,26,27,28],INF=[48,47,46,45,44,43,42,41,31,32,33,34,35,36,37,38];

function load(){try{S=JSON.parse(localStorage.getItem('cd_v1'))}catch(e){}if(!S||!S.patients)S={patients:[],updatedAt:0};S.appts=S.appts||[];S.pays=S.pays||[]}
function persist(){try{localStorage.setItem('cd_v1',JSON.stringify(S))}catch(e){}}
function save(){S.updatedAt=Date.now();persist();sync()}
function paintCloud(){var e=$('#cl');if(e)e.textContent=cloud}
function sync(){if(!ref)return;clearTimeout(timer);timer=setTimeout(function(){ref.set({json:JSON.stringify(S),updatedAt:S.updatedAt}).then(function(){cloud='Nube sincronizada';paintCloud()}).catch(function(){cloud='Pendiente de sincronizar (sin conexión)';paintCloud()})},1500)}
function initCloud(){
  if(!window.claude){cloud='Nube no disponible: los datos se guardan solo en este teléfono';paintCloud();return}
  Promise.all([claude.use('user'),claude.use('db')]).then(function(r){
    if(!r[0]||!r[1]){cloud='Nube no disponible: los datos se guardan solo en este teléfono';paintCloud();return}
    return r[0].id().then(function(id){
      ref=r[1].collection('data/users/'+id).doc('app');
      return ref.get().then(function(s){
        if(s.exists){var d=s.data();if(d.updatedAt>S.updatedAt){try{S=JSON.parse(d.json);persist();render()}catch(e){}}else if(S.updatedAt>(d.updatedAt||0)){sync()}}
        else if(S.patients.length){sync()}
        cloud='Nube conectada';paintCloud();
      })
    })
  }).catch(function(){cloud='Sin conexión a la nube: los datos se guardan en este teléfono';paintCloud()})
}
function P(){return S.patients.filter(function(p){return p.id===V.id})[0]}
function D(p,n){p.odo=p.odo||{};return p.odo[n]||(p.odo[n]={})}

function tsvg(d,size,faces){
  d=d||{};var p='',k;
  for(k in PT){var fl=d.abs?'#88888866':(COL[d[k]]||'var(--face)');
    p+='<polygon points="'+PT[k]+'"'+(faces?' data-act="face" data-f="'+k+'"':'')+' style="fill:'+fl+';stroke:var(--tile);stroke-width:1.6;'+(faces?'cursor:pointer':'')+'"/>'}
  if(d.abs)p+='<path d="M7 7L29 29M29 7L7 29" stroke="#777" stroke-width="2.4" fill="none" pointer-events="none"/>';
  if(d.ext)p+='<path d="M6 6L30 30M30 6L6 30" stroke="#D64545" stroke-width="3.2" fill="none" pointer-events="none"/>';
  if(d.pro)p+='<rect x="1.5" y="1.5" width="33" height="33" rx="10" fill="none" stroke="#0E8F8A" stroke-width="3" pointer-events="none"/>';
  return '<div class="tt" style="width:'+size+'px;height:'+size+'px;'+(size>60?'border-radius:22px':'')+'"><svg width="'+size+'" height="'+size+'" viewBox="0 0 36 36" style="display:block">'+p+'</svg>'+(size>60?lbls(d):'')+'</div>'}
function lbls(d){
  var q=Math.floor(V.sel/10),ml=(q===2||q===3),L={t:['V',50,15],b:[V.arch==='sup'?'P':'L',50,85],l:[ml?'M':'D',15,50],r:[ml?'D':'M',85,50],c:['O',50,50]},h='',k;
  for(k in L){var dark=d.abs?false:(COL[d[k]]&&d[k]!=='cor');
    h+='<span style="position:absolute;left:'+L[k][1]+'%;top:'+L[k][2]+'%;transform:translate(-50%,-50%);font-size:13px;font-weight:700;pointer-events:none;color:'+(dark?'#fff':'var(--ink)')+'">'+L[k][0]+'</span>'}
  return h}
function summary(p){
  var o=p.odo||{},c=0,t=0,a=0,pr=0,e=0,rx=0,n;
  for(n in o){var d=o[n];if(d.abs)a++;if(d.pro)pr++;if(d.ext)e++;if(d.rx)rx++;
    if(!d.abs){var f='tblrc'.split('').map(function(k){return d[k]});if(f.indexOf('car')>=0)c++;if(f.indexOf('obt')>=0||f.indexOf('cor')>=0||f.indexOf('end')>=0)t++}}
  return c+' con caries · '+t+' tratados · '+a+' ausentes · '+pr+' prótesis · '+e+' extracciones · '+rx+' Rx'}

function findOrCreate(n){n=(n||'').trim();if(!n)return null;var l=n.toLowerCase(),p=S.patients.filter(function(x){return x.name.trim().toLowerCase()===l})[0];if(!p){p={id:'p'+Date.now(),name:n,phone:'',allergy:'',notes:'',odo:{}};S.patients.push(p);save()}return p}
function listHTML(){var h=listHTML0(),q=V.q.trim();if(q&&!S.patients.some(function(p){return p.name.toLowerCase()===q.toLowerCase()}))h='<button class="btn o" data-act="quickadd" data-n="'+esc(q)+'" style="margin:10px 0">+ Agregar «'+esc(q)+'» como nuevo paciente</button>'+h;return h}
function listHTML0(){
  var q=V.q.toLowerCase(),L=S.patients.filter(function(p){return p.name.toLowerCase().indexOf(q)>=0}).sort(function(a,b){return a.name.localeCompare(b.name)});
  if(!L.length)return '<p class="mut" style="text-align:center;padding:24px 0">'+(S.patients.length?'Sin resultados.':'Aún no hay pacientes. Toca "+ Nuevo paciente".')+'</p>';
  return L.map(function(p){return '<button class="pi" data-act="open" data-id="'+p.id+'"><div class="av">'+esc(p.name.trim().split(/\s+/).slice(0,2).map(function(w){return w[0]}).join('').toUpperCase())+'</div><div style="flex:1"><div style="font-weight:700;font-size:16px">'+esc(p.name)+'</div><div class="mut">'+esc(p.phone||'Sin teléfono')+'</div></div><span style="color:var(--acc);font-size:22px">›</span></button>'}).join('')}
function odo(p){
  var nums=V.arch==='sup'?SUP:INF,d=D(p,V.sel),q=Math.floor(V.sel/10),u=V.sel%10;
  var g=nums.map(function(n){var x=(p.odo||{})[n]||{};return '<button class="tb'+(n===V.sel?' sel':'')+'" data-act="tooth" data-n="'+n+'" aria-label="Diente '+n+'">'+tsvg(x,36)+'<span>'+n+'</span>'+(x.rx?'<span class="rx">Rx</span>':'')+'</button>'}).join('');
  var ch=CONDS.map(function(c){return '<button class="pill'+(c[0]===V.cond?' on':'')+'" data-act="cond" data-k="'+c[0]+'">'+c[1]+'</button>'}).join('');
  return '<div class="card"><h2>Odontograma</h2><div class="mut" style="margin-bottom:10px">'+summary(p)+'</div>'
  +'<div class="seg"><button data-act="arch" data-a="sup" class="'+(V.arch==='sup'?'on':'')+'">Superior</button><button data-act="arch" data-a="inf" class="'+(V.arch==='inf'?'on':'')+'">Inferior</button></div>'
  +'<div class="grid" style="margin-top:12px">'+g+'</div></div>'
  +'<div class="card"><div style="display:flex;flex-wrap:wrap;gap:8px">'+ch+'</div>'
  +'<div class="row" style="margin-top:14px;align-items:flex-start">'+tsvg(d,132,true)+'<div style="flex:1;min-width:0"><div style="font-size:20px;font-weight:700">Diente '+V.sel+'</div><div class="mut">'+NAMES[u]+' · '+SIDE[q]+'</div><div class="mut" style="margin-top:6px">Elige una condición y toca las caras. Prótesis, extracción y ausente marcan todo el diente.</div></div></div>'
  +'<div class="row" style="margin-top:10px"><button class="btn'+(d.rx?'':' o')+'" style="margin-top:0;'+(d.rx?'background:#111':'')+'" data-act="rx">'+(d.rx?'Rx indicada ✓':'Pedir Rx')+'</button><button class="btn o" style="margin-top:0;color:var(--ink);border-color:var(--line)" data-act="clear">Limpiar diente</button></div>'
  +'<p class="mut" style="text-align:center">V vestibular · P palatino · L lingual · M mesial · D distal · O oclusal</p></div>'}
function applyTheme(){var t=S.theme||'auto',r=document.documentElement;if(t==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',t);var dk=t==='dark'||(t==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches),m=document.getElementById('tc');if(m)m.setAttribute('content',dk?'#111113':'#5b110b')}
function render(){applyTheme();
  var h='';
  if(V.v==='home'||V.v==='appts'||V.v==='newappt'||V.v==='att'||V.v==='pick'||V.v==='fin'||V.v==='newexp'||V.v==='stock'||V.v==='mat'||V.v==='newmat'||V.v==='cons'||V.v==='consd'){h=ext()}
  else if(V.v==='list'){
    h='<h1>Pacientes</h1><div class="mut">'+S.patients.length+' registrados</div><input id="q" placeholder="Buscar paciente" value="'+esc(V.q)+'"><button class="btn" data-act="new">+ Nuevo paciente</button><div class="card" id="plist" style="padding:4px 14px">'+listHTML()+'</div>'}
  else if(V.v==='new'){
    h='<button class="lk" data-act="back">← Pacientes</button><h1>Nuevo paciente</h1><div class="card"><label>Nombre completo</label><input id="f1" autocomplete="off"><label>Teléfono</label><input id="f2" inputmode="tel"><label>Alergias</label><input id="f3" placeholder="Ej. penicilina"><label>Notas</label><textarea id="f4" rows="3"></textarea><button class="btn" data-act="create">Guardar paciente</button></div>'}
  else if(V.v==='pat'){
    var p=P();if(!p){V.v='list';return render()}
    h='<button class="lk" data-act="back">← Pacientes</button><div class="row" style="margin-top:4px"><div class="av" style="width:52px;height:52px;border-radius:26px">'+esc(p.name.trim().split(/\s+/).slice(0,2).map(function(w){return w[0]}).join('').toUpperCase())+'</div><div style="flex:1"><h1 style="margin:0;font-size:24px">'+esc(p.name)+'</h1></div></div>'
    +'<div class="card"><label style="margin-top:0">Nombre</label><input data-fld="name" value="'+esc(p.name)+'"><label>Teléfono</label><input data-fld="phone" inputmode="tel" value="'+esc(p.phone)+'"><label>Alergias</label><input data-fld="allergy" value="'+esc(p.allergy)+'"><label>Notas</label><textarea data-fld="notes" rows="3">'+esc(p.notes)+'</textarea></div>'
    +odo(p)+hist(p)
    +'<button class="btn o" style="color:var(--bad);border-color:var(--bad)" data-act="del">'+(V.del?'Toca de nuevo para eliminar':'Eliminar paciente')+'</button>'}
  else{
    h='<h1>Ajustes</h1>'+setExtra()+'<div class="card"><h2>Respaldo</h2><div class="mut">Guarda una copia de todos tus pacientes en un archivo y restáurala cuando quieras.</div><button class="btn" data-act="backup">Descargar copia</button><button class="btn o" data-act="sharebk">Compartir copia (WhatsApp, Drive…)</button><button class="btn o" data-act="restore">Restaurar desde archivo</button><div class="mut" id="msg" style="margin-top:8px">'+(S.lastBackup?'Última copia: '+esc(S.lastBackup):'Aún no has hecho ninguna copia.')+'</div></div>'
    +'<div class="card"><h2>Dónde están tus datos</h2><div class="mut" id="cl">'+esc(cloud)+'</div><div class="mut" style="margin-top:6px">Clinova guarda todo en este teléfono y funciona sin internet. No hay copia en la nube: si pierdes el teléfono o borras los datos del navegador, solo te queda tu copia de respaldo. Hazla con frecuencia.</div></div>'
    +'<div class="card"><h2>Próximas fases</h2><div class="mut">Citas, Atender paciente, Finanzas (USD y CUP), Stock, Recetas y resumen mensual.</div></div>'}
  $('#app').innerHTML=h;
  navHL();
}
function msg(t){var e=$('#msg');if(e)e.textContent=t}
function act(a,el){
  if(act2(a,el))return;
  var p=V.id?P():null,t,d;
  if(a==='tab'){V.v=el.dataset.t;V.del=false;render()}
  else if(a==='new'){V.v='new';render()}
  else if(a==='back'){V.v='list';V.del=false;render()}
  else if(a==='create'){var n=$('#f1').value.trim();if(!n){$('#f1').focus();return}
    var np={id:'p'+Date.now(),name:n,phone:$('#f2').value.trim(),allergy:$('#f3').value.trim(),notes:$('#f4').value.trim(),odo:{}};S.patients.push(np);save();V.id=np.id;V.v='pat';V.sel=26;V.arch='sup';render()}
  else if(a==='open'){V.id=el.dataset.id;V.v='pat';V.sel=26;V.arch='sup';V.del=false;render()}
  else if(a==='arch'){V.arch=el.dataset.a;V.sel=V.arch==='sup'?26:36;render()}
  else if(a==='tooth'){V.sel=+el.dataset.n;render()}
  else if(a==='cond'){V.cond=el.dataset.k;render()}
  else if(a==='face'&&p){d=D(p,V.sel);var f=el.dataset.f,c=V.cond;
    if(c==='aus')d.abs=d.abs?0:1;else if(c==='pro')d.pro=d.pro?0:1;else if(c==='ext')d.ext=d.ext?0:1;else{d.abs=0;d[f]=(d[f]===c)?'sano':c}
    save();render()}
  else if(a==='rx'&&p){d=D(p,V.sel);d.rx=d.rx?0:1;save();render()}
  else if(a==='clear'&&p){p.odo[V.sel]={};save();render()}
  else if(a==='del'&&p){if(!V.del){V.del=true;render();return}S.patients=S.patients.filter(function(x){return x.id!==p.id});save();V.v='list';V.del=false;render()}
  else if(a==='backup'){var bl=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),bu=URL.createObjectURL(bl),ba=document.createElement('a');ba.href=bu;ba.download='respaldo-clinova-'+tod()+'.json';document.body.appendChild(ba);ba.click();ba.remove();setTimeout(function(){URL.revokeObjectURL(bu)},4000);S.lastBackup=tod();persist();render();msg('Copia descargada. Guárdala fuera del teléfono (Drive, WhatsApp o correo).')}
  else if(a==='sharebk'){var sf=new File([JSON.stringify(S,null,1)],'respaldo-clinova-'+tod()+'.json',{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[sf]})){navigator.share({files:[sf],title:'Respaldo Clinova'}).then(function(){S.lastBackup=tod();persist();render()}).catch(function(){})}else msg('Compartir no está disponible aquí. Usa Descargar copia.')}
  else if(a==='install'){if(window.dp){window.dp.prompt();window.dp=null;render()}}
  else if(a==='restore'){$('#rf').click()}

var TL=[['Consulta de Valoración',1],['Profilaxis Dental',1],['Blanqueamiento Dental',1],['Endodoncia',0],['Rx',0],['Corona con Espiga',0],['Puente Fijo',0],['Obturación',0],['Reconstrucción',0],['Carillas Estéticas',0],['Extracción',0]];
